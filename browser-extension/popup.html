<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RDMS Research Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>RDMS Research Capture</h1>
    <p>Save the page you opened as a portable file for offline RDMS import.</p>
    <button id="capture">Capture current page</button>
    <p id="status" role="status" aria-live="polite"></p>
    <small>Only the active tab is read after you click Capture. Nothing is uploaded.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
