name: Android beta verification

on:
  push:
    branches: [android-native]
  pull_request:
    branches: [android-native]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug
      - name: Run unit tests
        working-directory: android-native
        run: gradle :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rdms-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
