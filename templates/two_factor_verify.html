<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2FA · {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/pro.css') }}">
</head><body class="login-page">
<div class="login-card">
  <div class="brand center"><span class="brandmark lg">🔐</span>
    <div><b>Two-factor check</b><small>Enter the 6-digit code from your app</small></div>
  </div>
  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat,msg in msgs %}<div class="alert {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post" style="margin-top:18px">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>6-digit code<input name="code" placeholder="123456" maxlength="8" required autofocus autocomplete="one-time-code"></label>
    <button class="btn primary wide">Verify</button>
  </form>
  <p class="tiny" style="margin-top:14px">Lost your phone? Enter one of your backup codes.</p>
</div>
</body></html>
