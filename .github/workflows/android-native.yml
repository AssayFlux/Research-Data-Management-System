name: Android beta verification

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, android-native, android-ui-repair]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    branches: [android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug
      - name: Run unit tests
        working-directory: android-native
        run: gradle :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rdms-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
